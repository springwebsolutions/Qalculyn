name: qalculyn
description: "Qalculyn — All-in-One Calculator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.1
  intl: ^0.20.2
  share_plus: ^10.1.4
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/qalculyn_icon.jpg"
  adaptive_icon_background: "#1a1028"
  adaptive_icon_foreground: "assets/icon/qalculyn_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
